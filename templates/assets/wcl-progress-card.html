<style>
  .sg-carousel {
    position: relative;
    overflow: hidden;
    width: 100%;
    background: transparent;
  }

  .sg-carousel-track {
    display: flex;
    transition: transform 0.6s ease-in-out;
    will-change: transform;
  }

  .sg-carousel-slide {
    min-width: 100%;
    position: relative;
  }

  .sg-carousel-slide img {
    width: 100%;
    height: auto;
    max-height: 480px;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* YouTube lazy thumbnail slide */
  .sg-yt-thumb {
    position: relative;
    cursor: pointer;
    background: #000;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }

  .sg-yt-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
    transition: opacity 0.2s;
  }

  .sg-yt-thumb:hover img {
    opacity: 1;
  }

  .sg-yt-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .sg-yt-play svg {
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    transition: transform 0.2s;
  }

  .sg-yt-thumb:hover .sg-yt-play svg {
    transform: scale(1.1);
  }

  .sg-yt-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    border: none;
    background: #000;
  }

  /* Prev / Next arrows */
  .sg-carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.45);
    border: none;
    color: #fff;
    font-size: 1.6rem;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
    z-index: 10;
    border-radius: 4px;
    transition: background 0.2s;
    line-height: 1;
    user-select: none;
  }
  .sg-carousel-btn:hover { background: rgba(0, 0, 0, 0.75); }
  .sg-carousel-btn.prev { left: 0.5rem; }
  .sg-carousel-btn.next { right: 0.5rem; }

  /* Dot indicators */
  .sg-carousel-dots {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.5rem 0 0.25rem;
    background: transparent;
  }

  .sg-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s;
  }
  .sg-dot.active { background: #fff; }
</style>

<script>
(function () {
  const AUTO_DELAY_MS = 5000;

  const track  = document.getElementById('sgTrack');
  const dotsEl = document.getElementById('sgDots');
  const slides = Array.from(track.querySelectorAll('.sg-carousel-slide'));

  if (slides.length === 0) return;

  let current = 0;
  let timer   = null;

  // Build dot buttons
  slides.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'sg-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });

  // Hide controls when there's only one slide
  if (slides.length === 1) {
    dotsEl.style.display = 'none';
    document.getElementById('sgPrev').style.display = 'none';
    document.getElementById('sgNext').style.display = 'none';
  }

  function updateDots() {
    dotsEl.querySelectorAll('.sg-dot').forEach((d, i) =>
      d.classList.toggle('active', i === current));
  }

  // Pause any active YouTube iframe via postMessage, and restore
  // the lazy thumbnail if the user navigated away before interacting.
  function pauseAllVideos() {
    track.querySelectorAll('.sg-yt-frame').forEach(function (iframe) {
      iframe.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }),
        '*'
      );
    });
  }

  function goTo(index) {
    pauseAllVideos();
    current = (index + slides.length) % slides.length;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    updateDots();
    resetTimer();
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  // Stop auto-advance while a video slide is active so it doesn't
  // navigate away mid-playback.
  function resetTimer() {
    clearInterval(timer);
    const isVideoSlide = slides[current] && slides[current].classList.contains('sg-video-slide');
    if (slides.length > 1 && !isVideoSlide) {
      timer = setInterval(next, AUTO_DELAY_MS);
    }
  }

  document.getElementById('sgNext').addEventListener('click', next);
  document.getElementById('sgPrev').addEventListener('click', prev);

  // Pause on hover
  const carousel = document.getElementById('sgCarousel');
  carousel.addEventListener('mouseenter', () => clearInterval(timer));
  carousel.addEventListener('mouseleave', resetTimer);

  // Swipe support for mobile
  let touchStartX = 0;
  carousel.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, { passive: true });
  carousel.addEventListener('touchend', function(e) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
  });

  // Lazy YouTube thumbnail click-to-play
  track.querySelectorAll('.sg-yt-thumb').forEach(function (thumb) {
    function activateVideo() {
      var id = thumb.dataset.videoid;
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&enablejsapi=1&rel=0&modestbranding=1';
      iframe.className = 'sg-yt-frame';
      iframe.title = thumb.querySelector('img').alt;
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
      iframe.setAttribute('frameborder', '0');
      thumb.replaceWith(iframe);
      // Stop auto-advance now that the iframe is live
      clearInterval(timer);
    }

    thumb.addEventListener('click', activateVideo);
    // Keyboard accessibility: Enter or Space triggers play
    thumb.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activateVideo();
      }
    });
  });

  resetTimer();
})();
</script>

<script>
async function loadBossData() {
  try {
    const response = await fetch("/progress"); 
    if (!response.ok) throw new Error("Network response was not ok");

    const bossData = await response.json();

    document.getElementById('bossIcon').src = bossData.iconImageUrl;
    document.getElementById('bossName').textContent += bossData.name;
    document.getElementById('pullCount').textContent += bossData.pullCount;
    document.getElementById('bestPercent').textContent += bossData.bestPercentForDisplay;

  } catch (err) {
    console.error("Failed to load boss data:", err);
  }
}

loadBossData();
</script>
